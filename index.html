<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRUCTURE XR1 — Framework IA Autonome</title>
    <meta name="description" content="XR1 — Framework IA autonome multi-agents. Orchestration, clustering, et intelligence collective.">
    <meta property="og:title" content="STRUCTURE XR1 — Framework IA Autonome">
    <meta property="og:description" content="7 agents IA, 15+ providers. Self-hosted sur Raspberry Pi.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#E60000">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E60000;
            --bg: #050505;
            --white: #f0f0f0;
            --green: #00FF41;
            --gold: #C5A028;
            --blue: #06B6D4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* ── MATRIX RAIN ── */
        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ── FULL PAGE CENTER ── */
        .page {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── PANEL ── */
        .panel {
            background: rgba(0, 0, 0, 0.82);
            border: 1px solid rgba(230, 0, 0, 0.12);
            border-radius: 20px;
            padding: 52px 64px 44px;
            max-width: 880px;
            width: 92%;
            text-align: center;
        }

        /* ── BADGE ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(230,0,0,0.08);
            border: 1px solid rgba(230,0,0,0.2);
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 10px;
            color: var(--red);
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 36px;
            font-family: 'JetBrains Mono', monospace;
        }
        .badge .dot {
            width: 7px; height: 7px;
            background: var(--gold);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px var(--gold);
        }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

        /* ── TITLE ── */
        .title {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            margin-bottom: 12px;
            line-height: 1;
        }
        .title-top {
            display: block;
            font-size: clamp(18px, 3vw, 26px);
            letter-spacing: 14px;
            color: rgba(240,240,240,0.7);
            margin-bottom: 6px;
        }
        .title-xr1 {
            display: block;
            font-size: clamp(64px, 12vw, 110px);
            color: var(--red);
            letter-spacing: -3px;
            text-shadow: 0 0 60px rgba(230,0,0,0.4);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
        }

        /* ── SUBTITLE ── */
        .subtitle {
            font-size: 13px;
            letter-spacing: 5px;
            color: rgba(230,0,0,0.6);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── DESCRIPTION ── */
        .desc {
            font-size: 14px;
            color: #777;
            line-height: 1.7;
            margin-bottom: 36px;
        }

        /* ── STATS ── */
        .stats {
            display: flex;
            justify-content: center;
            margin-bottom: 36px;
        }
        .stat {
            text-align: center;
            padding: 0 24px;
            border-right: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .stat:last-child { border-right: none; }
        .stat-val {
            font-size: 24px;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
        }
        .stat-lbl {
            font-size: 8px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* ── DISCORD BTN ── */
        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 30px;
            border-radius: 8px;
            background: #5865F2;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(88,101,242,0.25);
            cursor: pointer;
        }
        .discord-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(88,101,242,0.4);
            background: #4752C4;
        }
        .discord-btn svg { width: 20px; height: 20px; fill: #fff; }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            .panel { padding: 36px 24px 32px; }
            .stats { flex-wrap: wrap; gap: 12px 0; }
            .stat { padding: 0 14px; }
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="page">
    <div class="panel">
        <div class="badge">
            <span class="dot"></span>
            DEV IN PROGRESS
        </div>

        <h1 class="title">
            <span class="title-top">STRUCTURE</span>
            <span class="title-xr1">XR1</span>
        </h1>

        <p class="subtitle">eXtended Reality #1</p>

        <p class="desc">
            Framework IA autonome multi-agents.<br>
            Orchestration, clustering, et intelligence collective.
        </p>

        <div class="stats">
            <div class="stat">
                <div class="stat-val" style="color:var(--red)" data-count="3">0</div>
                <div class="stat-lbl">Programmes</div>
            </div>
            <div class="stat">
                <div class="stat-val" style="color:var(--green)" data-count="15" data-suffix="+">0</div>
                <div class="stat-lbl">Providers</div>
            </div>
            <div class="stat">
                <div class="stat-val" style="color:var(--blue)" data-count="89" data-suffix="+">0</div>
                <div class="stat-lbl">Taches</div>
            </div>
            <div class="stat">
                <div class="stat-val" style="color:var(--gold)" data-count="7">0</div>
                <div class="stat-lbl">Agents</div>
            </div>
            <div class="stat">
                <div class="stat-val" style="color:var(--white)" data-count="9">0</div>
                <div class="stat-lbl">Controleurs</div>
            </div>
        </div>

        <a href="javascript:void(0)" class="discord-btn">
            <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
            Connexion Discord
        </a>
    </div>
</div>

<script>
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
const CHARS = 'XR1';
const FS = 14;
let drops = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drops = Array(Math.floor(canvas.width / FS)).fill(0).map(() => Math.floor(Math.random() * canvas.height / FS));
}
resize();
window.addEventListener('resize', resize);

setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#E60000';
    ctx.font = FS + 'px monospace';
    drops.forEach((y, i) => {
        ctx.fillText(CHARS[Math.floor(Math.random() * CHARS.length)], i * FS, y * FS);
        if (y * FS > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    });
}, 50);

// Animated counters
let counted = false;
const obs = new IntersectionObserver((entries) => {
    if (counted) return;
    entries.forEach(e => {
        if (!e.isIntersecting) return;
        counted = true;
        document.querySelectorAll('[data-count]').forEach(el => {
            const target = parseInt(el.dataset.count);
            const suffix = el.dataset.suffix || '';
            let current = 0;
            const step = Math.max(1, Math.floor(target / 30));
            const iv = setInterval(() => {
                current += step;
                if (current >= target) { current = target; clearInterval(iv); }
                el.textContent = current + suffix;
            }, 40);
        });
    });
}, { threshold: 0.5 });
obs.observe(document.querySelector('.stats'));
</script>
</body>
</html>
