<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRUCTURE XR1 — Framework IA Autonome</title>
    <meta name="description" content="XR1 — Framework IA autonome multi-agents. Orchestration, clustering, et intelligence collective deploye sur Raspberry Pi. Zero cout.">
    <meta property="og:title" content="STRUCTURE XR1 — Framework IA Autonome">
    <meta property="og:description" content="7 agents IA, 12+ providers, 40+ operations. Zero cout mensuel. Self-hosted sur Raspberry Pi.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#E60000">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E60000;
            --red-glow: #ff1a1a;
            --bg: #050505;
            --panel: #0a0a0a;
            --border: #1a1a1a;
            --muted: #666;
            --white: #f0f0f0;
            --green: #00FF41;
            --gold: #C5A028;
            --blue: #06B6D4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; overflow-x: hidden;
            background-image:
                linear-gradient(rgba(230,0,0,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(230,0,0,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(230,0,0,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(230,0,0,0.1);
            border: 1px solid rgba(230,0,0,0.3);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 12px;
            color: var(--red);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }
        .hero-badge .dot {
            width: 8px; height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px var(--green);
        }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

        .hero-title {
            font-size: clamp(48px, 8vw, 96px);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }
        .hero-title .xr1 {
            color: var(--red);
            text-shadow: 0 0 40px rgba(230,0,0,0.4);
        }
        .hero-sub {
            font-size: clamp(16px, 2.5vw, 22px);
            color: var(--muted);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .hero-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 48px;
        }
        .hero-stat {
            text-align: center;
        }
        .hero-stat-value {
            font-size: 36px;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
        }
        .hero-stat-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }
        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--red);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s;
            border: 2px solid var(--red);
        }
        .hero-cta:hover {
            background: transparent;
            color: var(--red);
            box-shadow: 0 0 30px rgba(230,0,0,0.3);
        }
        .hero-version {
            margin-top: 20px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── SECTIONS ── */
        .section {
            padding: 100px 40px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .section-label {
            font-size: 11px;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: clamp(28px, 4vw, 48px);
            font-weight: 900;
            margin-bottom: 16px;
            line-height: 1.1;
        }
        .section-desc {
            color: var(--muted);
            font-size: 16px;
            max-width: 600px;
            line-height: 1.7;
            margin-bottom: 48px;
        }

        /* ── FEATURES GRID ── */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .feature-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .feature-card:hover::before { opacity: 1; }
        .feature-card:hover { border-color: #333; transform: translateY(-4px); }
        .feature-icon {
            font-size: 28px;
            margin-bottom: 16px;
        }
        .feature-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .feature-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* ── AGENTS SECTION ── */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .agent-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
        }
        .agent-card:hover { border-color: var(--gold); transform: translateY(-4px); }
        .agent-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 12px;
        }
        .agent-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .agent-role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .agent-mode {
            display: inline-block;
            font-size: 9px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .mode-managed { background: rgba(230,0,0,0.15); color: var(--red); }
        .mode-swarm { background: rgba(0,255,65,0.1); color: var(--green); }
        .mode-auto { background: rgba(6,182,212,0.1); color: var(--blue); }
        .mode-down { background: rgba(102,102,102,0.2); color: var(--muted); }

        /* ── TECH STACK ── */
        .stack-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .stack-item {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .stack-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── FOOTER ── */
        .footer {
            border-top: 1px solid var(--border);
            padding: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            position: relative;
            z-index: 1;
        }
        .footer a { color: var(--red); text-decoration: none; }

        /* ── MATRIX RAIN ── */
        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.18;
        }

        /* ── DISCORD LOGIN ── */
        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 36px;
            border-radius: 10px;
            background: #5865F2;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(88,101,242,0.3);
            margin-top: 16px;
        }
        .discord-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(88,101,242,0.5);
            background: #4752C4;
        }
        .discord-btn svg { width: 24px; height: 24px; fill: #fff; }

        /* ── PROVIDERS SECTION ── */
        .providers-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .provider-chip {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .provider-chip:hover { border-color: var(--red); transform: scale(1.05); }
        .provider-status {
            width: 6px; height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .provider-status.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .provider-status.down { background: #666; }
        .provider-status.gated { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

        /* ── SCROLL REVEAL ── */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .hero-stats { flex-direction: column; gap: 20px; }
            .section { padding: 60px 20px; }
            .features-grid, .agents-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<!-- HERO -->
<section class="hero" role="banner" aria-label="Presentation XR1 Framework">
    <div class="hero-badge">
        <span class="dot" style="background:var(--gold);box-shadow:0 0 8px var(--gold);"></span>
        DEV IN PROGRESS
    </div>
    <h1 class="hero-title">
        STRUCTURE<br><span class="xr1">XR1</span>
    </h1>
    <p class="hero-sub" style="font-size:clamp(13px, 2vw, 16px);letter-spacing:3px;color:var(--red);font-weight:600;margin-bottom:12px;">
        eXtended Reality #1
    </p>
    <p class="hero-sub">
        Framework IA autonome multi-agents.<br>Orchestration, clustering, et intelligence collective.
    </p>
    <div class="hero-stats">
        <div class="hero-stat">
            <div class="hero-stat-value" style="color:var(--red)" data-count="3">0</div>
            <div class="hero-stat-label">Programmes</div>
        </div>
        <div class="hero-stat">
            <div class="hero-stat-value" style="color:var(--green)" data-count="15" data-suffix="+">0</div>
            <div class="hero-stat-label">Providers</div>
        </div>
        <div class="hero-stat">
            <div class="hero-stat-value" style="color:var(--blue)" data-count="89" data-suffix="+">0</div>
            <div class="hero-stat-label">Taches traitees</div>
        </div>
        <div class="hero-stat">
            <div class="hero-stat-value" style="color:var(--gold)" data-count="7">0</div>
            <div class="hero-stat-label">Agents</div>
        </div>
        <div class="hero-stat">
            <div class="hero-stat-value" style="color:var(--white)" data-count="9">0</div>
            <div class="hero-stat-label">Controleurs</div>
        </div>
    </div>
    <a href="javascript:void(0)" class="discord-btn" style="cursor:pointer;">
        <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        Connexion Discord
    </a>
    <div class="hero-version">v3.7.2</div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <p>STRUCTURE <strong style="color:var(--red)">XR1</strong> Framework</p>
    <p style="margin-top:8px;font-family:'JetBrains Mono',monospace;letter-spacing:2px;">v3.7.2</p>
</footer>

<script>
// ─── MATRIX RAIN XR1 ────────────────────────────────
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const chars = 'XR1XR1XR1STRUCTUREXR1';
const fontSize = 14;
let columns, drops;

function initDrops() {
    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(1);
}
initDrops();
window.addEventListener('resize', initDrops);

function drawMatrix() {
    ctx.fillStyle = 'rgba(5,5,5,0.06)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#E60000';
    ctx.font = fontSize + 'px JetBrains Mono';
    for (let i = 0; i < drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(drawMatrix, 50);

// Scroll reveal
const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
}, { threshold: 0.15 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

// Animated counters
let counted = false;
const counterObserver = new IntersectionObserver((entries) => {
    if (counted) return;
    entries.forEach(e => {
        if (!e.isIntersecting) return;
        counted = true;
        document.querySelectorAll('[data-count]').forEach(el => {
            const target = parseInt(el.dataset.count);
            const suffix = el.dataset.suffix || '';
            if (target === 0) { el.textContent = '0' + suffix; return; }
            let current = 0;
            const step = Math.max(1, Math.floor(target / 30));
            const interval = setInterval(() => {
                current += step;
                if (current >= target) { current = target; clearInterval(interval); }
                el.textContent = current + suffix;
            }, 40);
        });
    });
}, { threshold: 0.5 });
counterObserver.observe(document.querySelector('.hero-stats'));
</script>
</body>
</html>
